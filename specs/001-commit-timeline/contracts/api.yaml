openapi: 3.1.0
info:
  title: Cistory API
  description: GitHub Commit Timeline Service API
  version: 1.0.0

servers:
  - url: /api
    description: API Routes (Next.js App Router)

paths:
  # ============ Authentication ============
  /auth/github:
    get:
      summary: GitHub OAuth 로그인 시작
      tags: [Auth]
      responses:
        '302':
          description: GitHub OAuth 페이지로 리다이렉트

  /auth/github/callback:
    get:
      summary: GitHub OAuth 콜백
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 메인 페이지로 리다이렉트

  /auth/logout:
    post:
      summary: 로그아웃
      tags: [Auth]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/me:
    get:
      summary: 현재 사용자 정보
      tags: [Auth]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/disconnect:
    delete:
      summary: GitHub 연동 해제 및 모든 데이터 삭제
      tags: [Auth]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 연동 해제 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============ Repositories ============
  /repositories:
    get:
      summary: GitHub 레포지토리 목록 조회
      description: 사용자가 접근 가능한 모든 GitHub 레포지토리 목록
      tags: [Repositories]
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        '200':
          description: 레포지토리 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /repositories/tracked:
    get:
      summary: 추적 중인 레포지토리 목록
      tags: [Repositories]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 추적 중인 레포지토리 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackedRepository'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /repositories/{repoId}/track:
    post:
      summary: 레포지토리 추적 시작
      tags: [Repositories]
      security:
        - cookieAuth: []
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: integer
          description: GitHub 레포지토리 ID
      responses:
        '201':
          description: 추적 시작됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedRepository'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 이미 추적 중

    delete:
      summary: 레포지토리 추적 중지
      tags: [Repositories]
      security:
        - cookieAuth: []
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 추적 중지됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 추적 중인 레포지토리가 아님

  # ============ Timeline ============
  /timeline:
    get:
      summary: 통합 타임라인 조회
      description: 모든 추적 레포지토리의 커밋을 시간순으로 통합하여 조회
      tags: [Timeline]
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: repo_ids
          in: query
          description: 필터링할 레포지토리 ID (콤마 구분)
          schema:
            type: string
            example: "repo-uuid-1,repo-uuid-2"
        - name: from
          in: query
          description: 시작 날짜 (ISO 8601)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: 종료 날짜 (ISO 8601)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 타임라인 커밋 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /timeline/commits/{commitId}:
    get:
      summary: 커밋 상세 정보 및 요약
      tags: [Timeline]
      security:
        - cookieAuth: []
      parameters:
        - name: commitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 커밋 상세 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 커밋을 찾을 수 없음

  /timeline/commits/{commitId}/summary:
    post:
      summary: AI 요약 재생성 요청
      tags: [Timeline]
      security:
        - cookieAuth: []
      parameters:
        - name: commitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: 요약 생성 요청됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "요약 생성이 시작되었습니다"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 재시도 횟수 초과

  # ============ Sync ============
  /sync:
    post:
      summary: 수동 동기화 시작
      tags: [Sync]
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                repositoryId:
                  type: string
                  description: 특정 레포만 동기화 (없으면 전체)
      responses:
        '202':
          description: 동기화 시작됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 이미 동기화 진행 중

  /sync/status:
    get:
      summary: 동기화 상태 조회 (SSE)
      description: Server-Sent Events로 실시간 상태 전달
      tags: [Sync]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: SSE 스트림
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SyncStatusEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/jobs:
    get:
      summary: 최근 동기화 작업 목록
      tags: [Sync]
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 동기화 작업 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncJob'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============ Settings ============
  /settings:
    get:
      summary: 사용자 설정 조회
      tags: [Settings]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 설정 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      summary: 사용자 설정 변경
      tags: [Settings]
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
      responses:
        '200':
          description: 설정 변경됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  responses:
    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unauthorized"

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
        githubLogin:
          type: string
        githubAvatarUrl:
          type: string
        theme:
          type: string
          enum: [light, dark, system]
        syncIntervalHours:
          type: integer

    RepositoryListResponse:
      type: object
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/GitHubRepository'
        pagination:
          $ref: '#/components/schemas/Pagination'

    GitHubRepository:
      type: object
      properties:
        id:
          type: integer
          description: GitHub 레포지토리 ID
        fullName:
          type: string
          example: "owner/repo"
        description:
          type: string
        isPrivate:
          type: boolean
        defaultBranch:
          type: string
        isTracked:
          type: boolean
          description: 현재 추적 중인지 여부

    TrackedRepository:
      type: object
      properties:
        id:
          type: string
          description: 내부 UUID
        githubRepoId:
          type: integer
        githubFullName:
          type: string
        githubDescription:
          type: string
        isPrivate:
          type: boolean
        isActive:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
        commitCount:
          type: integer

    TimelineResponse:
      type: object
      properties:
        commits:
          type: array
          items:
            $ref: '#/components/schemas/TimelineCommit'
        pagination:
          $ref: '#/components/schemas/Pagination'

    TimelineCommit:
      type: object
      properties:
        id:
          type: string
        sha:
          type: string
        message:
          type: string
        authorName:
          type: string
        authorAvatarUrl:
          type: string
        committedAt:
          type: string
          format: date-time
        additions:
          type: integer
        deletions:
          type: integer
        changedFilesCount:
          type: integer
        isMergeCommit:
          type: boolean
        repository:
          type: object
          properties:
            id:
              type: string
            fullName:
              type: string
        summary:
          $ref: '#/components/schemas/CommitSummary'

    CommitDetail:
      allOf:
        - $ref: '#/components/schemas/TimelineCommit'
        - type: object
          properties:
            parentShas:
              type: array
              items:
                type: string

    CommitSummary:
      type: object
      properties:
        status:
          type: string
          enum: [pending, processing, completed, failed]
        technicalSummary:
          type: string
        nonTechnicalSummary:
          type: string
        retryCount:
          type: integer

    SyncJob:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, fetching, summarizing, completed, failed]
        triggerType:
          type: string
          enum: [manual, scheduled]
        totalCommits:
          type: integer
        processedCommits:
          type: integer
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    SyncStatusEvent:
      type: object
      description: SSE event data
      properties:
        status:
          type: string
          enum: [fetching, summarizing, completed, failed]
        message:
          type: string
          example: "AI 요약 생성 중... (3/5)"
        progress:
          type: object
          properties:
            current:
              type: integer
            total:
              type: integer

    UserSettings:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        syncIntervalHours:
          type: integer
          minimum: 1
          maximum: 24

    UserSettingsUpdate:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        syncIntervalHours:
          type: integer
          minimum: 1
          maximum: 24

    Pagination:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
