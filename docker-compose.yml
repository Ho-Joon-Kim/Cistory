services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: cistory-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cistory
      POSTGRES_USER: cistory
      POSTGRES_PASSWORD: cistory
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cistory -d cistory"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cistory:
    image: cistory:latest
    container_name: cistory
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Seoul
      # Cron runs in the dedicated cistory-cron container below so its CPU-heavy
      # background jobs never block this container's request-serving event loop.
      - DISABLE_CRON=true
      - DATABASE_URL=postgresql://cistory:cistory@postgres:5432/cistory
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Cron worker — same image, runs only the scheduler (DISABLE_CRON unset). No
  # published port: it serves no web traffic, so its event loop is free to run
  # AI summaries, location/subway processing, etc. without stalling the web app.
  cistory-cron:
    image: cistory:latest
    container_name: cistory-cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Seoul
      - DATABASE_URL=postgresql://cistory:cistory@postgres:5432/cistory
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Self-hosted road-network map matching. ghcr.io/valhalla/valhalla:latest is
  # a BARE image — Entrypoint [], Cmd [/bin/bash], no /valhalla directory, no
  # tile_urls/custom_files convenience env vars (those belong to a different
  # project, gis-ops/docker-valhalla, and this image reads none of them —
  # confirmed in docs/map-matching/valhalla-probe-findings.md). docker/valhalla
  # /entrypoint.sh calls the real binaries by hand: builds tiles into
  # /custom_files only when missing/stale/fingerprint-changed, then execs
  # valhalla_service in the foreground — so `restart: unless-stopped` is safe
  # here the same way it is for the other long-running services in this file;
  # the bare image's earlier restart-loop problem was its default Cmd exiting
  # immediately, not the restart policy. No published port: reached over the
  # internal network only.
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: cistory-valhalla
    restart: unless-stopped
    volumes:
      - cistory_valhalla_tiles:/custom_files
      - ./docker/valhalla/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - TILE_MAX_AGE_DAYS=365
      - EXTRACTS_FINGERPRINT=${EXTRACTS_FINGERPRINT:-}
      - VALHALLA_TILE_URLS=${VALHALLA_TILE_URLS:-}
      - VALHALLA_CONCURRENCY=2

volumes:
  postgres_data:
    external: true
    name: cistory_postgres_data
  cistory_valhalla_tiles:
