services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: cistory-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cistory
      POSTGRES_USER: cistory
      POSTGRES_PASSWORD: cistory
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cistory -d cistory"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cistory:
    image: cistory:latest
    container_name: cistory
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Seoul
      # Cron runs in the dedicated cistory-cron container below so its CPU-heavy
      # background jobs never block this container's request-serving event loop.
      - DISABLE_CRON=true
      - DATABASE_URL=postgresql://cistory:cistory@postgres:5432/cistory
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Cron worker — same image, runs only the scheduler (DISABLE_CRON unset). No
  # published port: it serves no web traffic, so its event loop is free to run
  # AI summaries, location/subway processing, etc. without stalling the web app.
  cistory-cron:
    image: cistory:latest
    container_name: cistory-cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Seoul
      - DATABASE_URL=postgresql://cistory:cistory@postgres:5432/cistory
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Self-hosted road-network map matching, built from docker/valhalla/Dockerfile
  # rather than used off the shelf — that Dockerfile layers osmium-tool onto
  # ghcr.io/valhalla/valhalla:latest, needed by entrypoint.sh's merge-before-
  # build step (see the comment there for why the merge exists: three or more
  # PBF inputs crash valhalla_build_tiles on this image). The base image is
  # otherwise a BARE image — Entrypoint [], Cmd [/bin/bash], no /valhalla
  # directory, no tile_urls/custom_files convenience env vars (those belong to
  # a different project, gis-ops/docker-valhalla, and this image reads none of
  # them — confirmed in docs/map-matching/valhalla-probe-findings.md). docker/
  # valhalla/entrypoint.sh calls the real binaries by hand: builds tiles into
  # /custom_files only when missing/stale/fingerprint-changed, then execs
  # valhalla_service in the foreground, so on a healthy boot it never exits.
  # `restart: unless-stopped` (matching postgres/cistory/cistory-cron below) is
  # safe here, on purpose: EXTRACTS_FINGERPRINT is REQUIRED and the entrypoint
  # hard-refuses (exit 1, loud and fast) if it's unset, rather than quietly
  # rebuilding tiles from scratch on every boot — that refusal is what used to
  # make an infinite restart loop the visible symptom of this misconfiguration
  # (see valhalla-probe-findings.md, Fix round 1 §1). A bounded policy like
  # `on-failure:N` was tried and reverted: unlike `unless-stopped`, it is NOT
  # re-applied when the Docker daemon itself restarts (a host reboot), so this
  # service would silently stay down after every reboot while postgres/cistory
  # came back — worse than the loop it was meant to avoid, since a loop at
  # least logs. Don't flip this back without also removing the entrypoint's
  # hard-refusal, since the two changes were solving the same problem from
  # opposite ends.
  # No published port: reached over the internal network only.
  valhalla:
    build:
      context: ./docker/valhalla
    image: cistory-valhalla:latest
    container_name: cistory-valhalla
    restart: unless-stopped
    volumes:
      - cistory_valhalla_tiles:/custom_files
      - ./docker/valhalla/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - TILE_MAX_AGE_DAYS=365
      - EXTRACTS_FINGERPRINT=${EXTRACTS_FINGERPRINT:-}
      - VALHALLA_TILE_URLS=${VALHALLA_TILE_URLS:-}
      - VALHALLA_CONCURRENCY=2
      # Tile *build* thread count — distinct from VALHALLA_CONCURRENCY above,
      # which is valhalla_service's request-handling concurrency once tiles
      # are already built. Bounded by default (not "all cores") because an
      # unbounded build OOM-killed on a real, memory-constrained host — see
      # the --mjolnir-concurrency comment in docker/valhalla/entrypoint.sh for
      # the full incident and the reasoning behind the default of 4. Override
      # per host via .env; memory available for this build varies by machine.
      - VALHALLA_BUILD_CONCURRENCY=${VALHALLA_BUILD_CONCURRENCY:-4}
    # /status is confirmed real (not a gis-ops/docker-valhalla convenience endpoint that this
    # bare image doesn't have): docs/map-matching/valhalla-probe-findings.md ran `docker exec
    # cistory-valhalla curl localhost:8002/status` against the live container and got back the
    # real version/actions payload. curl is present in the base image (also confirmed there) so
    # no extra install is needed. No published port, so this must run from inside the container —
    # matches how the finding above was actually verified.
    #
    # This is what lets `docker compose ps`/`docker inspect` show the one distinction that
    # mattered enough to write a whole CLAUDE.md rollout-order rule around: the container can be
    # up (accepted by Docker, `restart: unless-stopped` satisfied) for the ~30 minutes its first
    # tile build takes, while `valhalla_service` — the only thing bound to :8002 — hasn't even
    # exec'd yet (see entrypoint.sh: build_tiles runs, then `exec valhalla_service`). Before this,
    # nothing external could tell "building tiles" apart from "serving requests"; now `unhealthy`
    # means the former and `healthy` means the latter. No `depends_on: condition: service_healthy`
    # reads it (nothing in this compose file waits on valhalla to boot), so it's purely
    # observability — safe to add without changing startup ordering for any other service.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    external: true
    name: cistory_postgres_data
  cistory_valhalla_tiles:
