# Throwaway Postgres for integration tests — the src/**/*.integration.test.ts
# files that execute real SQL, run via `yarn test:integration` under
# vitest.integration.config.mts. Entirely separate from the dev/prod stack in
# docker-compose.yml: its own compose project (`name:` below — local dev
# only, see the CI note below), its own network, its own host port, its own
# storage. Nothing here reads or writes cistory-db or cistory-valhalla.
#
# `yarn db:test:down` (`docker compose -f docker-compose.test.yml down`)
# removes the container and network in one shot. There is no named volume to
# separately prune — see the tmpfs note below — so plain `down` already
# leaves nothing behind.
#
# CI (the Jenkinsfile's "Integration Tests" stage) never uses this file's
# `cistory-test` project/5433 defaults directly: two concurrent builds (this
# is a Multibranch Pipeline — every branch and every open PR is its own job,
# so "concurrent" is the normal case, not an edge case) sharing one project
# name would share one container, and sharing one host port would make the
# second build's `up` either collide or silently reuse the first build's
# instance. Jenkins instead passes `-p <build-scoped-project>` (overriding
# `name:` below) and `TEST_DB_HOST_PORT=0` (letting the OS assign a free
# port, read back via `docker compose port`) so every build gets its own
# project, container, and port. There's deliberately no `container_name:`
# pinning this service to one fixed name — compose derives the container
# name from the project, so it's automatically per-build in CI and a
# predictable `cistory-test-postgres-test-1` locally.
#
# TZ=Asia/Seoul mirrors docker-compose.yml's `postgres` service on purpose,
# not by habit. Postgres's `initdb` bakes the container's OS timezone into
# postgresql.conf as the session-default `TimeZone` GUC (confirmed live
# against this exact image: `SHOW timezone` -> `Asia/Seoul`, `pg_settings.source`
# -> `configuration file`) — and that session default is *why* a bare `now()`
# in raw SQL yields KST wall time in production while everything Drizzle
# writes stays UTC wall time (see src/db/sql.ts's file header). A test
# database left on the image's UTC default would make
# src/db/sql.integration.test.ts pass while the real nine-hour trap it exists
# to catch went right on shipping — so this line is load-bearing for test
# validity, not a cosmetic match to prod.
#
# platform: linux/amd64 is pinned because postgis/postgis publishes no arm64
# manifest at all — `docker pull postgis/postgis:17-3.5-alpine` fails
# outright on Apple Silicon without this line. It's a no-op on the amd64
# Jenkins agent (the same image already runs there unpinned, in
# docker-compose.yml) and transparently runs under emulation on an arm64 dev
# machine.
name: cistory-test

services:
  postgres-test:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: cistory_test
      POSTGRES_USER: cistory_test
      POSTGRES_PASSWORD: cistory_test
      TZ: Asia/Seoul
    ports:
      # 5433 is the local-dev default — package.json's fallback URLs hardcode
      # it too (yarn test:integration stays a single command, no env vars to
      # set). CI overrides via TEST_DB_HOST_PORT=0 (see the file header) to
      # get a collision-proof ephemeral port instead; the Jenkinsfile reads
      # the actual assigned port back with `docker compose port` and builds
      # TEST_DATABASE_URL/DATABASE_URL from that, never from this literal 5433.
      - "${TEST_DB_HOST_PORT:-5433}:5432"
    tmpfs:
      # No named/external volume on purpose: this container is meant to be
      # thrown away, and tmpfs keeps runs fast without ever touching disk.
      # Schema is reapplied by `yarn db:test:migrate` on every fresh start.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cistory_test -d cistory_test"]
      interval: 5s
      timeout: 5s
      retries: 10
